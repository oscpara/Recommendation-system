name: CI

on:
  push:
    branches: [dev]
  pull_request:

jobs:
  docker-test:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: myapp
      CONTAINER_PORT: 5000      # port your app runs on *inside* the container
      HOST_PORT: 8080           # port exposed on the runner (you can change it)
      TEST_ENDPOINT: "/your-endpoint"   # 👈 replace with your endpoint
    steps:
      - uses: actions/checkout@v4

      # Build Docker image
      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .

      # Run container
      - name: Run container
        run: docker run -d --name $IMAGE_NAME -p $HOST_PORT:$CONTAINER_PORT $IMAGE_NAME:${{ github.sha }}

      # Wait and curl your endpoint
      - name: Wait for app and test endpoint
        run: |
          echo "Waiting for app to start..."
          for i in {1..30}; do
            if curl -fsS http://localhost:$HOST_PORT$TEST_ENDPOINT >/dev/null; then
              echo "✅ App responded on $TEST_ENDPOINT"
              exit 0
            fi
            echo "Waiting for app... ($i)"
            sleep 2
          done
          echo "❌ App did not become healthy in time"
          docker logs $IMAGE_NAME
          exit 1

      # Clean up
      - name: Stop and remove container
        if: always()
        run: |
          docker stop $IMAGE_NAME || true
          docker rm $IMAGE_NAME || true